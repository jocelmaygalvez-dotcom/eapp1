<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badas NHS - Respondent Form</title>
    
    <style>
        /* --- RESET & BASIC SETUP --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* --- BACKGROUND IMAGE SETUP --- */
        body {
            /* Your background image */
            background-image: url('BADAS_NHS8.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            /* Flexbox to center the form perfectly on the screen */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            
            /* Adds a slight dark overlay so the form stands out more */
            background-color: rgba(0, 0, 0, 0.4);
            background-blend-mode: overlay;
        }

        /* --- FORM CONTAINER STYLING --- */
        .form-container {
            background-color: rgba(255, 255, 255, 0.95); /* Solid white with slight transparency */
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 500px;
            margin: 20px;
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
            font-size: 24px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #444;
            font-size: 14px;
        }

        .input-group input, 
        .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        /* Highlight border when clicking on an input */
        .input-group input:focus, 
        .input-group textarea:focus {
            outline: none;
            border-color: #d32f2f; /* Red color matching school logo */
        }

        /* --- SUBMIT BUTTON STYLING --- */
        button {
            width: 100%;
            padding: 14px;
            background-color: #d32f2f; /* Red color matching school logo */
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #b71c1c; /* Darker red on hover */
        }

        button:active {
            transform: scale(0.98); /* Slight click effect */
        }
    </style>
</head>
<body>

    <!-- FORM SECTION -->
    <div class="form-container">
        <h2>Respondent Record</h2>
        
        <!-- Formspree action removed. ID added for your custom Vercel backend -->
        <form id="respondentForm">
            
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label for="response">Your Response</label>
                <textarea id="response" name="response" rows="4" placeholder="Type your response here..." required></textarea>
            </div>

            <button type="submit">Submit Data</button>
            
        </form>
    </div>

    <!-- JAVASCRIPT FOR FORM HANDLING -->
    <script>
        document.getElementById('respondentForm').addEventListener('submit', function(event) {
            // This prevents the page from reloading when the button is clicked
            event.preventDefault();
            
            // You can replace this alert with your Vercel API / SQL database code later
            alert('Form submitted! Connect your Vercel API here.');
            
            // Optional: Clears the form fields after hitting submit
            this.reset(); 
        });
    </script>

</body>
</html>
